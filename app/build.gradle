plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.cofc.guard'
    compileSdk 34

    defaultConfig {
        applicationId "com.cofc.guard"
        minSdk 29
        targetSdk 34
        versionCode 500
        versionName "5.0.0"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            storeFile file('keystore/cofc_guard.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD') ?: 'COFC_GUARD_2026'
            keyAlias 'cofc_guard'
            keyPassword System.getenv('KEY_PASSWORD') ?: 'COFC_GUARD_2026'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
