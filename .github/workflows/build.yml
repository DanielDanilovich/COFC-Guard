name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Generate Keystore
      run: |
        mkdir -p app/keystore
        keytool -genkey -v -keystore app/keystore/cofc_guard.jks \
          -alias cofc_guard -keyalg RSA -keysize 2048 -validity 10000 \
          -storepass COFC_GUARD_2026 -keypass COFC_GUARD_2026 \
          -dname "CN=COFC GUARD, OU=Cyber Security, O=COFC TECHNOLOGIES LTD, L=Jerusalem, ST=Israel, C=IL"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: COFC-GUARD-APK
        path: app/build/outputs/apk/release/app-release.apk
